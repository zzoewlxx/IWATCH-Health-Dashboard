<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>健康数据看板</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>健康数据看板</h1>
      <div class="sub" id="subtitle"></div>
    </div>
    <button class="ghost" id="themeBtn" type="button" title="切换浅色 / 深色">外观：跟随系统</button>
  </header>
</div>

<div class="controls">
  <div class="wrap">
    <nav class="tabs" id="tabs" role="tablist" aria-label="分区"></nav>
    <div class="filters" id="filters">
      <div class="group">
        <span class="lbl">时间范围</span>
        <div class="seg" id="presets" role="group" aria-label="时间范围"></div>
      </div>
      <div class="group">
        <input type="date" id="dateFrom" aria-label="开始日期">
        <span class="lbl">至</span>
        <input type="date" id="dateTo" aria-label="结束日期">
      </div>
      <div class="group">
        <span class="lbl">粒度</span>
        <div class="seg" id="grans" role="group" aria-label="粒度"></div>
      </div>
      <span class="span" id="spanInfo"></span>
    </div>
  </div>
</div>

<div class="wrap">
  <main id="main"></main>
</div>

<script src="vendor/echarts.min.js"></script>
<script src="data.js"></script>
<script src="intraday.js"></script>
<script src="core.js"></script>
<script src="charts.js"></script>
<script src="insights.js"></script>
<script src="tabs.js"></script>
</body>
</html>
